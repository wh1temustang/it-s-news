name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  common:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r ../requirements.txt
      - run: pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v

  template-rendering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-rendering
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r ../requirements.txt
      - run: pip install --no-deps -e ../common -e .
      - run: python -m unittest discover -s tests -v
      - run: for page in examples/*.html; do python -m template_rendering scan "$page"; done

  meme-rendering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meme-rendering
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r ../requirements.txt
      - run: pip install --no-deps -e ../common -e .
      - run: python -m unittest discover -s tests -v
      - run: for page in examples/*.html; do python -m meme_rendering scan "$page"; done

  daily-edition:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-edition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
